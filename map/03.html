<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZYRO - Animated & Directional Character Test</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0c10;
            color: #fff;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: rgba(15, 15, 26, 0.85);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            z-index: 10;
            border-bottom: 2px solid #1f2833;
            font-size: 12px;
            color: #66fcf1;
        }

        #controls-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            touch-action: none;
        }

        #joystick-zone {
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(102, 252, 241, 0.3);
            border-radius: 50%;
            position: relative;
        }

        #joystick-stick {
            width: 40px;
            height: 40px;
            background: #66fcf1;
            border-radius: 50%;
            position: absolute;
            top: 28px;
            left: 28px;
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.6);
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <div>⚡ ANIMAÇÃO DE PERNAS & ROTAÇÃO 8 DIREÇÕES</div>
        <div>📍 POS: <span id="coordsDisplay">0, 0</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="controls-container">
        <div id="joystick-zone">
            <div id="joystick-stick"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const GRID_SIZE = 14;
        const TILE_WIDTH = 120;
        const TILE_HEIGHT = 60;

        const player = {
            worldX: 0,
            worldY: 0,
            speed: 0.05,
            dirIndex: 0, // 0: S, 1: SE, 2: E, 3: NE, 4: N, 5: NW, 6: W, 7: SW
            isMoving: false,
            animStep: 0
        };

        function worldToScreen(wx, wy) {
            const relX = wx - player.worldX;
            const relY = wy - player.worldY;

            const screenX = (canvas.width / 2) + (relX - relY) * (TILE_WIDTH / 2);
            const screenY = (canvas.height / 2) + (relX + relY) * (TILE_HEIGHT / 2);
            return { x: screenX, y: screenY };
        }

        // Função que desenha e gera dinamicamente o SVG do personagem com base na direção e passada
        function buildCharacterSprite(dir, isMoving, step) {
            // Fator de animação de caminhada
            const legShift = isMoving ? Math.sin(step * 0.3) * 7 : 0;
            const armShift = isMoving ? Math.cos(step * 0.3) * 6 : 0;
            const bodyBobbing = isMoving ? Math.abs(Math.sin(step * 0.3)) * 2 : 0;

            let bodyContent = "";

            // Mapeamento de ângulos / visual do Zomboid em 2.5D:
            // Direction 4 = Costas (Norte)
            // Direction 0 = Frente (Sul)
            // Directions 2, 6 = Perfil Lado (Leste / Oeste)
            // Directions 1, 3, 5, 7 = Diagonais

            const isFacingBack = (dir === 3 || dir === 4 || dir === 5);
            const isFacingProfile = (dir === 2 || dir === 6);
            const flipX = (dir === 5 || dir === 6 || dir === 7) ? -1 : 1;

            if (isFacingProfile) {
                // VISUAL DE PERFIL (ANDANDO PARA O LADO)
                bodyContent = `
                    <!-- Pernas em Passada de Perfil -->
                    <rect x="${30 + legShift}" y="58" width="7" height="26" rx="3" fill="#1b2a38" />
                    <rect x="${30 - legShift}" y="58" width="7" height="26" rx="3" fill="#233548" />
                    <rect x="${29 + legShift}" y="80" width="9" height="7" rx="2" fill="#0d0d0d" />
                    <rect x="${29 - legShift}" y="80" width="9" height="7" rx="2" fill="#0d0d0d" />

                    <!-- Tronco Lateral -->
                    <rect x="24" y="30" width="18" height="30" rx="4" fill="#2b3a4a" stroke="#151d26" stroke-width="2" />
                    <rect x="18" y="34" width="12" height="18" rx="3" fill="#3a4b35" /> <!-- Mochila lateral -->

                    <!-- Braço em balanço -->
                    <rect x="${28 - armShift}" y="32" width="6" height="22" rx="3" fill="#233548" />
                    <circle cx="${31 - armShift}" cy="56" r="3.5" fill="#e0ac69" />

                    <!-- Cabeça de Perfil -->
                    <circle cx="33" cy="18" r="9" fill="#e0ac69" />
                    <path d="M 24 10 C 32 10, 38 14, 33 22 C 28 22, 24 18, 24 10 Z" fill="#3a2212" /> <!-- Cabelo -->
                `;
            } else if (isFacingBack) {
                // VISUAL DE COSTAS (ANDANDO PARA CIMA / NORTE)
                bodyContent = `
                    <!-- Pernas (Movimento alternado) -->
                    <rect x="${23}" y="${58 + legShift}" width="8" height="26" rx="3" fill="#1b2a38" />
                    <rect x="${33}" y="${58 - legShift}" width="8" height="26" rx="3" fill="#233548" />
                    <rect x="22" y="${80 + legShift}" width="10" height="7" rx="2" fill="#0d0d0d" />
                    <rect x="32" y="${80 - legShift}" width="10" height="7" rx="2" fill="#0d0d0d" />

                    <!-- Mochila em destaque nas costas -->
                    <rect x="18" y="32" width="28" height="26" rx="5" fill="#3a4b35" stroke="#233020" stroke-width="2" />

                    <!-- Braços nas laterais -->
                    <rect x="${10}" y="${32 - armShift}" width="7" height="22" rx="3" fill="#233548" />
                    <rect x="${47}" y="${32 + armShift}" width="7" height="22" rx="3" fill="#2b3a4a" />

                    <!-- Cabeça de Costas (Só Cabelo) -->
                    <circle cx="32" cy="18" r="10" fill="#3a2212" />
                `;
            } else {
                // VISUAL DE FRENTE / DIAGONAL SUL (ANDANDO PARA BAIXO)
                bodyContent = `
                    <!-- Pernas (Passada Frontal) -->
                    <rect x="23" y="${58 + legShift}" width="8" height="26" rx="3" fill="#1b2a38" />
                    <rect x="33" y="${58 - legShift}" width="8" height="26" rx="3" fill="#233548" />
                    <rect x="22" y="${80 + legShift}" width="10" height="7" rx="2" fill="#0d0d0d" />
                    <rect x="32" y="${80 - legShift}" width="10" height="7" rx="2" fill="#0d0d0d" />

                    <!-- Tronco Frontal -->
                    <rect x="16" y="30" width="32" height="30" rx="5" fill="#2b3a4a" stroke="#151d26" stroke-width="2" />
                    <polygon points="28,30 32,38 36,30" fill="#d9d9d9" /> <!-- Gola/Camisa -->

                    <!-- Braços -->
                    <rect x="10" y="${32 - armShift}" width="7" height="22" rx="3" fill="#233548" />
                    <rect x="47" y="${32 + armShift}" width="7" height="22" rx="3" fill="#2b3a4a" />
                    <circle cx="13.5" cy="${56 - armShift}" r="3.5" fill="#e0ac69" />
                    <circle cx="50.5" cy="${56 + armShift}" r="3.5" fill="#e0ac69" />

                    <!-- Rosto e Cabelo -->
                    <rect x="29" y="24" width="6" height="7" fill="#c99352" />
                    <circle cx="32" cy="18" r="10" fill="#e0ac69" />
                    <path d="M 22 16 C 22 7, 42 7, 42 16 Z" fill="#3a2212" />
                `;
            }

            const rawSVG = `
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="96" viewBox="0 0 64 96">
                <!-- Sombra -->
                <ellipse cx="32" cy="86" rx="18" ry="8" fill="rgba(0,0,0,0.4)" />
                <g transform="translate(0, ${-bodyBobbing})">
                    ${bodyContent}
                </g>
            </svg>`;

            const img = new Image();
            img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(rawSVG);
            return { img, flipX };
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Render do Chão Isométrico
            const halfGrid = GRID_SIZE / 2;
            for (let x = -halfGrid; x < halfGrid; x++) {
                for (let y = -halfGrid; y < halfGrid; y++) {
                    const pos = worldToScreen(x, y);

                    ctx.beginPath();
                    ctx.moveTo(pos.x, pos.y);
                    ctx.lineTo(pos.x + TILE_WIDTH / 2, pos.y + TILE_HEIGHT / 2);
                    ctx.lineTo(pos.x, pos.y + TILE_HEIGHT);
                    ctx.lineTo(pos.x - TILE_WIDTH / 2, pos.y + TILE_HEIGHT / 2);
                    ctx.closePath();

                    ctx.fillStyle = (x + y) % 2 === 0 ? "#181e29" : "#222a38";
                    ctx.fill();
                    ctx.strokeStyle = "rgba(102, 252, 241, 0.05)";
                    ctx.stroke();
                }
            }

            // Atualiza passo da animação
            if (player.isMoving) {
                player.animStep += 1;
            } else {
                player.animStep = 0;
            }

            const sprite = buildCharacterSprite(player.dirIndex, player.isMoving, player.animStep);
            const screenCenter = { x: canvas.width / 2, y: canvas.height / 2 };

            ctx.save();
            ctx.translate(screenCenter.x, screenCenter.y);
            
            // Inverte horizontalmente caso o personagem esteja virado para a esquerda (NO, O, SO)
            if (sprite.flipX === -1) {
                ctx.scale(-1, 1);
            }

            if (sprite.img.complete) {
                ctx.drawImage(sprite.img, -32, -86, 64, 96);
            }
            ctx.restore();

            document.getElementById('coordsDisplay').innerText = `${player.worldX.toFixed(1)}, ${player.worldY.toFixed(1)}`;

            requestAnimationFrame(render);
        }

        // Joystick
        const joyZone = document.getElementById('joystick-zone');
        const joyStick = document.getElementById('joystick-stick');
        let isDragging = false;
        let joyVector = { x: 0, y: 0 };

        function handleMove(clientX, clientY) {
            const rect = joyZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let deltaX = clientX - centerX;
            let deltaY = clientY - centerY;
            const distance = Math.min(Math.hypot(deltaX, deltaY), 30);
            const angle = Math.atan2(deltaY, deltaX);

            const moveX = Math.cos(angle) * distance;
            const moveY = Math.sin(angle) * distance;

            joyStick.style.transform = `translate(${moveX}px, ${moveY}px)`;

            if (distance > 2) {
                joyVector.x = moveX / 30;
                joyVector.y = moveY / 30;
                player.isMoving = true;

                // Converte o ângulo do Joystick em 8 Direções discretas
                // 0: S, 1: SE, 2: E, 3: NE, 4: N, 5: NW, 6: W, 7: SW
                let octant = Math.round((angle + Math.PI) / (Math.PI / 4)) % 8;
                
                // Mapeia o ângulo para o índice correto
                const dirMap = [6, 5, 4, 3, 2, 1, 0, 7];
                player.dirIndex = dirMap[octant];
            } else {
                joyVector = { x: 0, y: 0 };
                player.isMoving = false;
            }
        }

        joyZone.addEventListener('pointerdown', (e) => {
            isDragging = true;
            handleMove(e.clientX, e.clientY);
        });

        window.addEventListener('pointermove', (e) => {
            if (isDragging) handleMove(e.clientX, e.clientY);
        });

        window.addEventListener('pointerup', () => {
            if (isDragging) {
                isDragging = false;
                joyStick.style.transform = `translate(0px, 0px)`;
                joyVector = { x: 0, y: 0 };
                player.isMoving = false;
            }
        });

        setInterval(() => {
            if (player.isMoving) {
                player.worldX += (joyVector.x + joyVector.y) * player.speed;
                player.worldY += (joyVector.y - joyVector.x) * player.speed;
            }
        }, 1000 / 60);

        render();
    </script>
</body>
</html>
