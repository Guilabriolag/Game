<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZYRO - Isometric Movement Fix</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0c10;
            color: #fff;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: rgba(15, 15, 26, 0.85);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            z-index: 10;
            border-bottom: 2px solid #1f2833;
            font-size: 12px;
            color: #66fcf1;
        }

        #controls-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            touch-action: none;
        }

        #joystick-zone {
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(102, 252, 241, 0.3);
            border-radius: 50%;
            position: relative;
        }

        #joystick-stick {
            width: 40px;
            height: 40px;
            background: #66fcf1;
            border-radius: 50%;
            position: absolute;
            top: 28px;
            left: 28px;
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.6);
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <div>⚡ CORREÇÃO DE MOVIMENTO & ROTAÇÃO 360°</div>
        <div>📍 POS: <span id="coordsDisplay">0, 0</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="controls-container">
        <div id="joystick-zone">
            <div id="joystick-stick"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const GRID_SIZE = 12;
        const TILE_WIDTH = 80;
        const TILE_HEIGHT = 40;

        const player = {
            worldX: 0,
            worldY: 0,
            speed: 0.06,
            angle: 0,
            isMoving: false,
            animFrame: 0
        };

        // Pré-carrega o SVG na memória para não sumir durante o movimento
        const playerImg = new Image();
        const rawSVG = `
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
            <!-- Sombra -->
            <ellipse cx="32" cy="32" rx="18" ry="18" fill="rgba(0,0,0,0.3)" />
            
            <!-- Personagem Zomboid Visto de Cima/Diagonal -->
            <!-- Mochila -->
            <rect x="22" y="36" width="20" height="10" rx="3" fill="#3a4b35" />
            
            <!-- Tronco / Jaqueta -->
            <rect x="18" y="20" width="28" height="18" rx="6" fill="#2b3a4a" stroke="#151d26" stroke-width="2" />
            
            <!-- Braços e Mãos -->
            <circle cx="14" cy="28" r="5" fill="#2b3a4a" />
            <circle cx="50" cy="28" r="5" fill="#2b3a4a" />
            <circle cx="12" cy="22" r="3.5" fill="#e0ac69" />
            <circle cx="52" cy="22" r="3.5" fill="#e0ac69" />

            <!-- Cabeça / Cabelo -->
            <circle cx="32" cy="24" r="9" fill="#e0ac69" />
            <path d="M 23 23 C 23 14, 41 14, 41 23 Z" fill="#3a2212" />
        </svg>`;
        playerImg.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(rawSVG);

        function worldToScreen(wx, wy) {
            const relX = wx - player.worldX;
            const relY = wy - player.worldY;

            const screenX = (canvas.width / 2) + (relX - relY) * (TILE_WIDTH / 2);
            const screenY = (canvas.height / 2) + (relX + relY) * (TILE_HEIGHT / 2);
            return { x: screenX, y: screenY };
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Renderiza o terreno isométrico
            const halfGrid = GRID_SIZE / 2;
            for (let x = -halfGrid; x < halfGrid; x++) {
                for (let y = -halfGrid; y < halfGrid; y++) {
                    const pos = worldToScreen(x, y);

                    ctx.beginPath();
                    ctx.moveTo(pos.x, pos.y);
                    ctx.lineTo(pos.x + TILE_WIDTH / 2, pos.y + TILE_HEIGHT / 2);
                    ctx.lineTo(pos.x, pos.y + TILE_HEIGHT);
                    ctx.lineTo(pos.x - TILE_WIDTH / 2, pos.y + TILE_HEIGHT / 2);
                    ctx.closePath();

                    ctx.fillStyle = (x + y) % 2 === 0 ? "#151922" : "#1f2430";
                    ctx.fill();
                    ctx.strokeStyle = "rgba(102, 252, 241, 0.08)";
                    ctx.stroke();
                }
            }

            // Animação de caminhada (balanço sutil de passo)
            if (player.isMoving) {
                player.animFrame += 0.2;
            }
            const walkOffsetY = player.isMoving ? Math.sin(player.animFrame) * 3 : 0;

            // Renderiza e Gira o Personagem na Direção do Joystick
            const screenCenter = { x: canvas.width / 2, y: canvas.height / 2 };

            ctx.save();
            ctx.translate(screenCenter.x, screenCenter.y + walkOffsetY);
            ctx.rotate(player.angle); // Rotação fluida baseada no joystick
            
            if (playerImg.complete) {
                ctx.drawImage(playerImg, -32, -32, 64, 64);
            }
            ctx.restore();

            document.getElementById('coordsDisplay').innerText = `${player.worldX.toFixed(1)}, ${player.worldY.toFixed(1)}`;

            requestAnimationFrame(render);
        }

        // Controle pelo Joystick
        const joyZone = document.getElementById('joystick-zone');
        const joyStick = document.getElementById('joystick-stick');
        let isDragging = false;
        let joyVector = { x: 0, y: 0 };

        function handleMove(clientX, clientY) {
            const rect = joyZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let deltaX = clientX - centerX;
            let deltaY = clientY - centerY;
            const distance = Math.min(Math.hypot(deltaX, deltaY), 30);
            const angle = Math.atan2(deltaY, deltaX);

            const moveX = Math.cos(angle) * distance;
            const moveY = Math.sin(angle) * distance;

            joyStick.style.transform = `translate(${moveX}px, ${moveY}px)`;

            if (distance > 2) {
                joyVector.x = moveX / 30;
                joyVector.y = moveY / 30;
                player.isMoving = true;
                // Ajusta a rotação para alinhar a orientação do sprite com a direção do movimento
                player.angle = angle + Math.PI / 2;
            } else {
                joyVector = { x: 0, y: 0 };
                player.isMoving = false;
            }
        }

        joyZone.addEventListener('pointerdown', (e) => {
            isDragging = true;
            handleMove(e.clientX, e.clientY);
        });

        window.addEventListener('pointermove', (e) => {
            if (isDragging) handleMove(e.clientX, e.clientY);
        });

        window.addEventListener('pointerup', () => {
            if (isDragging) {
                isDragging = false;
                joyStick.style.transform = `translate(0px, 0px)`;
                joyVector = { x: 0, y: 0 };
                player.isMoving = false;
            }
        });

        setInterval(() => {
            if (player.isMoving) {
                player.worldX += (joyVector.x + joyVector.y) * player.speed;
                player.worldY += (joyVector.y - joyVector.x) * player.speed;
            }
        }, 1000 / 60);

        render();
    </script>
</body>
</html>
